env:
  browser: true
  es2022: true
  node: true

extends:
  - airbnb-base
  - plugin:vue/recommended
  # Last: turns off formatting rules that fight Prettier, disables arrow-body-style / prefer-arrow-callback vs prettier/prettier, enables prettier/prettier.
  - plugin:prettier/recommended

parser: vue-eslint-parser

parserOptions:
  ecmaVersion: 2022
  sourceType: module
  parser: '@babel/eslint-parser'
  requireConfigFile: false

ignorePatterns:
  - node_modules/
  - dist/
  - build/
  - coverage/
  - '*.min.js'
  - prisma/db/
  - uploads/

settings:
  import/resolver:
    node:
      extensions:
        - .js
        - .vue

rules:
  # Мы можем импортить файлы .../.../...../
  import/no-relative-packages: off
  # Все импорты именнованные
  import/prefer-default-export: off
  # По умолчанию для фронта можно без расширений
  import/extensions:
    - error
    - ignorePackages
    - js: never
      vue: always
  # иногда нужно указать все аргументы
  no-unused-vars:
    - error
    - argsIgnorePattern: '^_'

  no-magic-numbers: ['error', { 'ignore': [0, 1, 2] }]

  # Mirror .prettierrc.json so eslint-plugin-prettier matches CLI when the IDE worker does not resolve the config file.
  prettier/prettier:
    - error
    - singleQuote: true
      semi: true
      trailingComma: all
      endOfLine: lf
      printWidth: 100
      tabWidth: 2

overrides:
  # Но для Node-серверных файлов — требуем .js
  - files:
      - 'server/**/*.js'
      - 'scripts/**/*.js'
      - 'specs/**/*.js'
      - '*.config.js'
    rules:
      import/extensions:
        - error
        - ignorePackages
        - js: always
  # Root PostCSS/Vite configs legitimately import devDependencies (not in airbnb’s default glob list).
  - files:
      - '*.config.js'
    rules:
      import/no-extraneous-dependencies:
        - error
        - devDependencies: true
