<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Advocado</title>
    <meta
      name="description"
      content="Teamwork extension for Chrome"
    />
    <link
      rel="icon"
      href="favicon-32x32.png"
    />
  </head>
  <body>
    <canvas
      id="magicCanvas"
      style="display: none"
    ></canvas>
    <div id="magicImage">
      <img
        src="Man Of Steel Superman Sticker.gif"
        alt="Highlight image"
      />
    </div>
    <div id="app"></div>
    <style>
      #magicCanvas {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        z-index: 1;
        pointer-events: none;
      }
      #magicImage {
        display: none;
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        z-index: 1;
        pointer-events: none;
      }
      #magicImage.magicImage--magicImageReveal {
        animation: magicImageReveal 2s ease-out forwards;
      }
      #magicImage.magicImage--loopWinReveal {
        animation: loopWinReveal 2s ease-out forwards;
      }
      @keyframes magicImageReveal {
        0% {
          opacity: 0;
          transform: scale(0.1);
        }
        75% {
          opacity: 1;
          transform: scale(5);
        }
        90% {
          opacity: 1;
          transform: scale(5);
        }
        100% {
          animation-timing-function: ease-in;
          opacity: 0;
          transform: scale(3);
        }
      }
      @keyframes loopWinReveal {
        0% {
          opacity: 0;
        }
        50% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
      #magicImage img {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }
      #app {
        position: relative;
        z-index: 0;
      }
    </style>
    <script
      type="module"
      src="/src/main.js"
    ></script>
  </body>
</html>
